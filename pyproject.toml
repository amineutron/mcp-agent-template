[project]
name = "mcp-guard"
version = "0.1.0"
description = "Guard layer for MCP servers in companies: roles, allowlist policy, human confirmation, JSONL audit log"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "amineutron" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "model-context-protocol", "llm-agents", "audit", "rbac",
            "local-first", "self-hosted", "on-prem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/amineutron/mcp-agent-template"
Repository = "https://github.com/amineutron/mcp-agent-template"
Issues = "https://github.com/amineutron/mcp-agent-template/issues"

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_guard"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
